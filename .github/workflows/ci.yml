name: CI/CD DevOps EP3

on:
  push:
    branches:
      - main
      - develop
      - ep3-observabilidad
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Report high vulnerabilities
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=pom.xml --severity-threshold=high

      - name: Block critical vulnerabilities
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=pom.xml --severity-threshold=critical

  tests:
    name: Tests and JaCoCo
    runs-on: ubuntu-latest
    needs: snyk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests and generate coverage
        run: mvn clean verify

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: warn

  sonar:
    name: SonarCloud Quality Gate
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify SONAR_TOKEN is set
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN secret is NOT set or is empty!"
            exit 1
          else
            echo "SONAR_TOKEN is set (length: ${#SONAR_TOKEN} characters)"
          fi

      - name: Run SonarCloud analysis and wait for Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.newCode.referenceBranch=main

  deploy-aws:
    name: Deploy to AWS EC2 with Docker Compose
    runs-on: [self-hosted, ep3, deploy]
    needs: sonar
    if: github.ref == 'refs/heads/ep3-observabilidad'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy microservice with Docker Compose
        run: docker compose up -d --build

      - name: Validate deployed API
        run: |
          sleep 15
          curl -f http://localhost:8082/api/v1/solicitudes
